name: Deploy → Vercel Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    name: Validate → Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          MISSING=0
          for f in index.html css/styles.v8.css js/app.v8.js sw.js _headers vercel.json robots.txt sitemap.xml; do
            if [ ! -f "$f" ]; then
              echo "❌ MISSING: $f"
              MISSING=1
            else
              echo "✓ $f"
            fi
          done
          [ $MISSING -eq 0 ] || exit 1

      - name: Validate image assets
        run: |
          AVIF=$(find assets/images -name "*.avif" | wc -l)
          WEBP=$(find assets/images -name "*.webp" | wc -l)
          JPG=$(find assets/images  -name "*.jpg"  | wc -l)
          echo "AVIF: $AVIF | WebP: $WEBP | JPG: $JPG"
          [ $AVIF -ge 18 ] || (echo "❌ AVIF images missing" && exit 1)

      - name: Check GA4 Measurement ID
        run: |
          if grep -q "G-XXXXXXXXXX" js/app.v8.js; then
            echo "⚠️  WARNING: GA4 placeholder G-XXXXXXXXXX not replaced."
            echo "   Analytics will not track. Replace in js/app.v8.js line 295."
          else
            echo "✓ GA4 Measurement ID configured"
          fi

      - name: Validate JSON-LD (no broken JSON)
        run: |
          python3 -c "
          import re, json, sys
          html = open('index.html').read()
          blocks = re.findall(r'<script type=\"application/ld\+json\">(.*?)</script>', html, re.DOTALL)
          for i, b in enumerate(blocks):
              try:
                  json.loads(b)
                  print(f'✓ JSON-LD block {i+1} valid')
              except Exception as e:
                  print(f'❌ JSON-LD block {i+1} invalid: {e}')
                  sys.exit(1)
          "

      - name: Deploy to Vercel (Production — main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

      - name: Deploy Preview (Pull Requests)
        if: github.event_name == 'pull_request'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
